<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<title>Catálogo de Bolsas</title>

<style>
body{
    margin:0;
    font-family:'Montserrat';
    background:#fff5f8;
}

/* HEADER */
header{
    background:#000;
    text-align:center;
    padding:40px 20px;
}

.logo{
    width:clamp(110px,14vw,170px);
    height:clamp(110px,14vw,170px);
    object-fit:cover;
    border-radius:50%;
    border:3px solid #d4af37;
    margin-bottom:15px;
}

.titulo{
    font-family:'Cinzel';
    color:#f7c6d9;
    letter-spacing:2px;
    font-size:clamp(18px,3vw,26px);
}

/* GRID */
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:20px;
}

/* CARD */
.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    transition:.3s;
    position:relative;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 20px 40px rgba(0,0,0,0.12);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
    cursor:pointer;
    transition:.4s;
}

.card:hover img{
    transform:scale(1.08);
}

/* FAVORITO */
.fav{
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    border-radius:50%;
    padding:6px;
    cursor:pointer;
    font-size:14px;
}

/* INFO */
.info{
    padding:15px;
    text-align:center;
}

.price{
    color:#d4af37;
    font-weight:bold;
    font-size:16px;
}

/* BOTON */
.btn{
    margin-top:10px;
    padding:10px;
    border:1px solid #d4af37;
    background:black;
    color:white;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#f7c6d9;
    color:black;
}

/* 🛒 ICONO */
.cart-icon{
    position:fixed;
    top:20px;
    right:20px;
    background:black;
    color:#f7c6d9;
    padding:14px;
    border-radius:50%;
    cursor:pointer;
    z-index:1000;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.cart-count{
    position:absolute;
    top:-5px;
    right:-5px;
    background:#f7c6d9;
    color:black;
    font-size:12px;
    padding:3px 6px;
    border-radius:50%;
}

/* 🛒 CARRITO */
.cart-panel{
    position:fixed;
    right:-350px;
    top:20px;
    width:300px;
    max-height:85vh;
    background:white;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
    padding:20px;
    transition:.4s;
    z-index:1000;
    display:flex;
    flex-direction:column;
}

.cart-panel.active{
    right:20px;
}

.cart-panel h3{
    font-family:'Cinzel';
    color:#d4af37;
    margin-top:0;
}

#lista{
    overflow-y:auto;
    max-height:300px;
    padding:0;
}

#lista li{
    list-style:none;
    padding:8px 0;
    border-bottom:1px solid #eee;
}

.remove{
    color:#ff4d6d;
    cursor:pointer;
}

/* BOTONES */
.clear{
    background:black;
    color:white;
    padding:10px;
    margin-top:10px;
    text-align:center;
    border-radius:10px;
    cursor:pointer;
}

.whatsapp{
    margin-top:10px;
    background:#25D366;
    padding:12px;
    text-align:center;
    text-decoration:none;
    color:white;
    border-radius:10px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    background:rgba(0,0,0,0.9);
    width:100%;
    height:100%;
    top:0;
    left:0;
    justify-content:center;
    align-items:center;
}

.modal img{
    max-width:90%;
    max-height:85%;
    border-radius:12px;
}

/* WHATS */
.float-wsp{
    position:fixed;
    bottom:20px;
    left:20px;
    background:#25D366;
    color:white;
    padding:14px;
    border-radius:50%;
    font-size:22px;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
<img src="logo.webp" class="logo">
<h2 class="titulo">ELEGANT MONKEY SHOP<br>CATÁLOGO DE BOLSAS</h2>
</header>

<!-- CARRITO -->
<div class="cart-icon" onclick="toggleCart()">
🛒
<div class="cart-count" id="count">0</div>
</div>

<div class="cart-panel" id="panel">
<h3>Tu pedido</h3>
<ul id="lista"></ul>
<div class="clear" onclick="vaciar()">Vaciar</div>
<a id="enviar" class="whatsapp" target="_blank">Enviar pedido</a>
</div>

<div class="container" id="productos"></div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="cerrarModal()">
<img id="imgModal">
</div>

<a href="https://wa.me/5219381264237" class="float-wsp">💬</a>

<script>
let carrito=[];

function toggleCart(){
panel.classList.toggle("active");
}

function agregar(id){
carrito.push("Bolsa "+id);
actualizar();
}

function eliminar(i){
carrito.splice(i,1);
actualizar();
}

function vaciar(){
carrito=[];
actualizar();
}

function actualizar(){
lista.innerHTML="";
carrito.forEach((p,i)=>{
lista.innerHTML+=`<li>${p} <span class="remove" onclick="eliminar(${i})">✖</span></li>`;
});
count.textContent=carrito.length;

let txt=encodeURIComponent("Hola quiero estas bolsas: "+carrito.join(", "));
enviar.href=`https://wa.me/5219381264237?text=${txt}`;
}

/* ZOOM */
function abrirModal(src){
modal.style.display="flex";
imgModal.src=src;
}

function cerrarModal(){
modal.style.display="none";
}

/* FAVORITOS */
document.addEventListener("click",e=>{
if(e.target.classList.contains("fav")){
e.target.textContent=e.target.textContent==="♡"?"♥":"♡";
}
});

/* AUTOMÁTICO */
for(let i=1;i<=45;i++){
productos.innerHTML+=`
<div class="card">
<div class="fav">♡</div>
<img src="b${i}.webp" onclick="abrirModal(this.src)">
<div class="info">
<div>Bolsa Luxury Collection</div>
<div class="price">precio al contactarnos</div>
<button class="btn" onclick="agregar(${i})">Agregar</button>
</div>
</div>`;
}
</script>

</body>
</html>
